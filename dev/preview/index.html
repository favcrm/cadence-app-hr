<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR · Local preview</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font: 13px/1.4 system-ui, sans-serif; background: #0b0d10; color: #c9d1d9; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; padding: 0.5rem 0.75rem; border-bottom: 1px solid #222a33; }
    header strong { color: #fff; }
    nav { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    nav a { padding: 0.15rem 0.5rem; border: 1px solid #2d3743; border-radius: 4px; color: inherit; text-decoration: none; }
    nav a[aria-current="true"] { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    #status { margin-left: auto; color: #8b949e; }
    iframe { flex: 1; width: 100%; border: 0; background: #0f1318; }
  </style>
</head>
<body>
  <header>
    <strong>HR · local preview</strong>
    <nav id="scenarios" aria-label="Scenario"></nav>
    <nav id="locales" aria-label="Language"></nav>
    <span id="status" role="status">Connecting synthetic fixtures…</span>
  </header>
  <iframe id="hr-frame" name="hr-frame" title="HR app — synthetic fixtures"></iframe>
  <script type="module" src="./host.ts"></script>
</body>
</html>
